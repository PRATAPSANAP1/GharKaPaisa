apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
    /* Folders */
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/react-native-codegen")
}

def enableSeparateBuildPerCPUArchitecture = false
def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:jsc-android:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.oitstack.mobile"
    defaultConfig {
        applicationId "com.oitstack.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    if (enableSeparateBuildPerCPUArchitecture) {
        splits {
            abi {
                reset()
                enable enableSeparateBuildPerCPUArchitecture
                universalApk false
                include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (project.hasProperty("hermesEnabled") ? hermesEnabled.toBoolean() : true) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (project.hasProperty("newArchEnabled") ? newArchEnabled.toBoolean() : false) {
    react {
        jsRootDir = file("../../src")
        libraryName = "GharKaPaisaApp"
        codegenDir = file("../../node_modules/react-native-codegen")
    }
}
